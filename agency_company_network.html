<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เครือข่ายหน่วยงาน–คู่สัญญา</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root{--bg:#fffaf0;--ink:#202a3b;--muted:#7c8492;--line:#e8dfcf;--blue:#2463d4;--high:#e1434b;--mid:#f6a800;--low:#10a558}
    *{box-sizing:border-box}html,body,#chart{width:100%;height:100%;margin:0;overflow:hidden}
    body{font-family:"Sarabun","Noto Sans Thai",Tahoma,sans-serif;color:var(--ink);background-color:var(--bg);background-image:radial-gradient(circle at 50% 51%,rgba(255,255,255,.98) 0 20%,rgba(255,255,255,.55) 42%,rgba(246,238,222,.78) 100%),radial-gradient(rgba(68,79,98,.09) .65px,transparent .65px);background-size:auto,13px 13px}
    #chart{min-height:260px}
    .state{position:fixed;inset:0;display:grid;place-items:center;padding:28px;text-align:center;background:inherit;z-index:4;color:var(--muted);line-height:1.65}
    .state[hidden]{display:none}.state b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}.state.error b{color:#b42318}
  </style>
</head>
<body>
  <div id="chart" role="img" aria-label="แผนภาพความสัมพันธ์ระหว่างหน่วยงานกับบริษัทคู่สัญญา"></div>
  <div id="state" class="state"><div><b>กำลังเตรียมเครือข่าย</b>กำลังอ่านข้อมูลโครงการ…</div></div>

<script>
(() => {
  const query = new URLSearchParams(location.search);
  const CSV_URL = query.get('data') || 'projects.csv';
  const requestedAgency = (query.get('agency') || query.get('agencyId') || '').trim();
  const TOP_N = Math.max(5, Math.min(20, Number(query.get('top')) || 12));
  const colors = {high:'#e1434b',mid:'#f6a800',low:'#10a558'};
  const labels = {high:'เสี่ยงสูง',mid:'เสี่ยงกลาง',low:'เสี่ยงต่ำ'};
  const rank = {low:1,mid:2,high:3};
  const state = document.getElementById('state');
  const chart = echarts.init(document.getElementById('chart'),null,{renderer:'canvas'});
  const compactMoney = n => new Intl.NumberFormat('th-TH',{notation:'compact',maximumFractionDigits:1}).format(n || 0) + ' บาท';
  const integer = n => new Intl.NumberFormat('th-TH').format(n || 0);
  const num = v => Number(String(v || 0).replace(/,/g,'')) || 0;
  const cleanTax = v => String(v || '').replace(/\D/g,'').padStart(13,'0');
  const html = v => String(v ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

  function fail(title,message){
    state.classList.add('error');
    state.innerHTML=`<div><b>${html(title)}</b>${message}</div>`;
    state.hidden=false;
  }

  function findAgency(rows){
    const agencies=[...new Set(rows.map(r=>(r.agency||'').trim()).filter(Boolean))];
    if(!requestedAgency) return null;
    return agencies.find(a=>a===requestedAgency)
      || agencies.find(a=>a.includes(requestedAgency))
      || agencies.find(a=>requestedAgency.includes(a));
  }

  function build(rows,agency){
    const companies=new Map();
    rows.forEach(r=>{
      if((r.agency||'').trim()!==agency || !(r.winner||'').trim()) return;
      const tax=cleanTax(r.tax_id), key=tax==='0000000000000'?(r.winner||'').trim():tax;
      if(!companies.has(key)) companies.set(key,{id:key,name:(r.winner||'').trim(),tax:tax==='0000000000000'?'':tax,count:0,value:0,maxLevel:'low',risks:{high:0,mid:0,low:0}});
      const c=companies.get(key), level=['high','mid','low'].includes(r.level_)?r.level_:'low';
      c.count++; c.value+=num(r.agreed||r.contract||r.budget); c.risks[level]++;
      if(rank[level]>rank[c.maxLevel]) c.maxLevel=level;
    });
    const all=[...companies.values()].sort((a,b)=>b.count-a.count||b.value-a.value);
    return {all,shown:all.slice(0,TOP_N)};
  }

  function render(agency,all,shown){
    if(!shown.length) return fail('ไม่พบคู่สัญญา','หน่วยงานนี้ยังไม่มีข้อมูลบริษัทผู้ชนะในชุดข้อมูล');
    const w=chart.getWidth(),h=chart.getHeight(),small=w<460||h<330;
    const cx=w*.50,cy=h*(small?.55:.56);
    const radiusX=Math.max(92,Math.min(w*.37,h*.56));
    const radiusY=Math.max(76,Math.min(h*.33,w*.28));
    const maxCount=Math.max(...shown.map(c=>c.count),1),maxValue=Math.max(...shown.map(c=>c.value),1);
    const totalValue=all.reduce((s,c)=>s+c.value,0),totalProjects=all.reduce((s,c)=>s+c.count,0);
    const agencySize=Math.max(64,Math.min(90,Math.min(w,h)*.21));
    const nodes=[{
      id:'agency',name:agency,x:cx,y:cy,fixed:true,symbolSize:agencySize,value:totalValue,
      itemStyle:{color:new echarts.graphic.RadialGradient(.34,.28,.8,[{offset:0,color:'#67a1ff'},{offset:.42,color:'#2f6fdd'},{offset:1,color:'#1749a0'}]),shadowBlur:25,shadowColor:'rgba(30,91,202,.42)',borderColor:'rgba(255,255,255,.95)',borderWidth:3},
      label:{show:true,position:'inside',formatter:p=>`{agency|${truncate(p.name,small?16:22)}}\n{agencySub|หน่วยงาน}`,width:agencySize-11,overflow:'break',align:'center',rich:{agency:{color:'#fff',fontWeight:700,fontSize:small?10:11,lineHeight:14,align:'center'},agencySub:{color:'rgba(255,255,255,.72)',fontSize:8,lineHeight:13,align:'center'}}}
    }];
    const links=[];
    shown.forEach((c,i)=>{
      const angle=-Math.PI/2+i*Math.PI*2/shown.length;
      const nodeSize=24+31*Math.sqrt(c.value/maxValue);
      nodes.push({
        id:c.id,name:c.name,x:cx+radiusX*Math.cos(angle),y:cy+radiusY*Math.sin(angle),fixed:true,
        symbolSize:nodeSize,value:c.value,company:c,
        itemStyle:{color:new echarts.graphic.RadialGradient(.34,.28,.75,[{offset:0,color:'#fff'},{offset:.18,color:colors[c.maxLevel]},{offset:1,color:shade(colors[c.maxLevel],-.22)}]),borderColor:'#fff',borderWidth:2.5,shadowBlur:14,shadowColor:colors[c.maxLevel]+'66'},
        label:{show:!small||shown.length<=10,position:Math.cos(angle)<-.25?'left':Math.cos(angle)>.25?'right':Math.sin(angle)<0?'top':'bottom',distance:5,formatter:p=>`{name|${truncate(p.name,small?14:20)}}\n{count|${integer(c.count)} ครั้ง}`,width:small?88:128,overflow:'truncate',rich:{name:{fontSize:small?9:10,fontWeight:600,color:'#364052',lineHeight:14},count:{fontSize:8,color:colors[c.maxLevel],fontWeight:700,lineHeight:11}}}
      });
      links.push({source:'agency',target:c.id,value:c.count,lineStyle:{width:1.15+5.2*c.count/maxCount,color:colors[c.maxLevel],opacity:.32,curveness:(i%2?1:-1)*(.025+.025*(i%3))}});
    });

    chart.setOption({
      backgroundColor:'transparent',animationDuration:650,animationEasing:'cubicOut',
      title:{
        text:'เครือข่ายคู่สัญญา',subtext:`${integer(totalProjects)} โครงการ   •   ${integer(all.length)} บริษัท   •   ${compactMoney(totalValue)}`,
        left:'center',top:10,textAlign:'center',textStyle:{fontFamily:'inherit',fontSize:small?14:16,fontWeight:700,color:'#202a3b'},subtextStyle:{fontFamily:'inherit',fontSize:small?9:10,color:'#7c8492',lineHeight:19}
      },
      tooltip:{
        trigger:'item',confine:true,backgroundColor:'rgba(24,31,45,.96)',borderColor:'rgba(255,255,255,.12)',borderWidth:1,padding:[11,13],extraCssText:'border-radius:10px;box-shadow:0 10px 28px rgba(25,34,50,.24)',textStyle:{fontFamily:'inherit',fontSize:11,color:'#fff',lineHeight:18},
        formatter:p=>{
          if(p.dataType==='edge') return `<b>${integer(p.data.value)} ครั้ง</b>`;
          if(!p.data.company) return `<b>${html(agency)}</b><br>${integer(totalProjects)} โครงการ<br>${integer(all.length)} บริษัทคู่สัญญา<br>${compactMoney(totalValue)}`;
          const c=p.data.company;
          return `<b>${html(c.name)}</b><br>${c.tax?'เลขผู้เสียภาษี '+html(c.tax)+'<br>':''}${integer(c.count)} โครงการ · ${compactMoney(c.value)}<br><span style="color:${colors[c.maxLevel]}">●</span> ${labels[c.maxLevel]}`;
        }
      },
      graphic:[
        {type:'ellipse',silent:true,z:-5,shape:{cx,cy,rx:radiusX*.78,ry:radiusY*.78},style:{fill:'transparent',stroke:'rgba(52,76,112,.09)',lineWidth:1,lineDash:[3,6]}},
        {type:'ellipse',silent:true,z:-5,shape:{cx,cy,rx:radiusX*1.05,ry:radiusY*1.05},style:{fill:'transparent',stroke:'rgba(52,76,112,.07)',lineWidth:1}},
        {type:'circle',silent:true,z:-4,shape:{cx,cy,r:agencySize*.68},style:{fill:'rgba(36,99,212,.025)',stroke:'rgba(36,99,212,.08)',lineWidth:1}},
        {
        type:'group',right:10,bottom:8,children:[
          {type:'circle',shape:{cx:0,cy:0,r:4},style:{fill:colors.high}},{type:'text',x:8,y:-6,style:{text:'สูง',font:'10px sans-serif',fill:'#737b88'}},
          {type:'circle',shape:{cx:35,cy:0,r:4},style:{fill:colors.mid}},{type:'text',x:43,y:-6,style:{text:'กลาง',font:'10px sans-serif',fill:'#737b88'}},
          {type:'circle',shape:{cx:82,cy:0,r:4},style:{fill:colors.low}},{type:'text',x:90,y:-6,style:{text:'ต่ำ',font:'10px sans-serif',fill:'#737b88'}}
        ]}],
      series:[{
        type:'graph',layout:'none',roam:true,data:nodes,links,edgeSymbol:['none','none'],
        lineStyle:{cap:'round'},emphasis:{focus:'adjacency',scale:1.12,lineStyle:{opacity:.9}},select:{disabled:true},silent:false
      }]
    },true);
    state.hidden=true;
  }

  function truncate(text,n){text=String(text||'');return text.length>n?text.slice(0,n-1)+'…':text;}
  function shade(hex,amount){
    const n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+Math.round(255*amount))),g=Math.max(0,Math.min(255,((n>>8)&255)+Math.round(255*amount))),b=Math.max(0,Math.min(255,(n&255)+Math.round(255*amount)));
    return '#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
  }

  if(!requestedAgency){
    fail('ยังไม่ได้เลือกหน่วยงาน','กรุณาส่งชื่อผ่าน URL เช่น <code>?agency=มหาวิทยาลัยเชียงใหม่</code>');
    return;
  }

  Papa.parse(CSV_URL,{download:true,header:true,skipEmptyLines:true,complete:result=>{
    const agency=findAgency(result.data);
    if(!agency) return fail('ไม่พบหน่วยงาน',`ไม่พบ “${html(requestedAgency)}” ในข้อมูล`);
    const data=build(result.data,agency); render(agency,data.all,data.shown);
  },error:e=>fail('โหลดข้อมูลไม่สำเร็จ',`${html(e.message)}<br>ตรวจสอบว่า HTML และ projects.csv อยู่ในโฟลเดอร์เดียวกัน`)});

  let resizeTimer;
  addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{chart.resize();location.reload();},180)});
})();
</script>
</body>
</html>
